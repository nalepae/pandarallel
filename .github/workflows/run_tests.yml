name: PyTest
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    name: pytest - OS ${{ matrix.os }} - Python ${{ matrix.python-version }} - pandas ${{ matrix.pandas-version }} 
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        pandas-version: ["2.0", "2.1", "2.2", ""]

        exclude:
          - python-version: "3.12"
            pandas-version: "2.0"
          - python-version: "3.13"
            pandas-version: "2.0"
          - python-version: "3.13"
            pandas-version: "2.1"

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    - name: Replace with specific pandas version (${{ matrix.pandas-version }})
      if: ${{ matrix.pandas-version }}
      run: pip install pandas==${{ matrix.pandas-version }}
    - name: Test with pytest
      run: |
        pytest --cov=pandarallel
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
